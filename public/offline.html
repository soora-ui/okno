<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181712" media="(prefers-color-scheme: dark)" />
    <title>Нет связи — okno</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf7f1;
        --surface: #ffffff;
        --line: #d3c5b3;
        --ink: #23241f;
        --muted: #656055;
        --btn-bg: #23241f;
        --btn-text: #faf7f1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181712;
          --surface: #201e18;
          --line: #38352c;
          --ink: #f2ede2;
          --muted: #9a9384;
          --btn-bg: #f2ede2;
          --btn-text: #181712;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--ink);
        font-family: Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 360px;
        padding: 32px 24px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--surface);
        text-align: center;
      }
      svg { width: 56px; height: 56px; }
      h1 { margin: 20px 0 8px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0 0 24px; color: var(--muted); font-size: 15px; line-height: 1.5; }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 999px;
        background: var(--btn-bg);
        color: var(--btn-text);
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <circle cx="256" cy="256" r="180.65" fill="none" stroke="currentColor" stroke-width="86.7" />
      </svg>
      <h1>Нет подключения</h1>
      <p>Проверьте интернет. Как только связь вернётся, страница откроется сама.</p>
      <button type="button" id="retry">Попробовать снова</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", () => location.reload());
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
